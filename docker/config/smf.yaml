# Open5GS SMF — 5G SA only.
# Identical to the gradiant/open5gs:2.7.0 default except that the freeDiameter
# (Gx/Gy, EPC-only) configuration is removed: the default smf.conf references a
# PCRF host that does not exist in a 5G SA deployment and makes the SMF abort.
logger:
  file: /opt/open5gs/var/log/open5gs/smf.log

global:

smf:
  sbi:
    server:
      - dev: eth0
        port: 7777
    client:
      scp:
        - uri: http://scp:7777
  pfcp:
    server:
      - dev: eth0
    client:
      upf:
        - address: upf
  gtpc:
    server:
      - dev: eth0
  gtpu:
    server:
      - dev: eth0
  metrics:
    server:
      - dev: eth0
        port: 9090
  session:
    - subnet: 10.45.0.1/16
      dnn: internet
    - subnet: 2001:db8:cafe::1/48
  dns:
    - 8.8.8.8
    - 8.8.4.4
  mtu: 1400
  ctf:
    enabled: no
