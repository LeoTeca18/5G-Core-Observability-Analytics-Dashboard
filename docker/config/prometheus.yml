# Prometheus scrape configuration for 5G Core containers
# Reference: https://prometheus.io/docs/prometheus/latest/configuration/

global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: upf
    static_configs:
      - targets: ["upf:9090"]
        labels:
          nf: UPF

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
